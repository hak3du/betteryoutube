<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CONSTRUCT | ALGORITHMIC ENGINE</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050505; font-family: 'Helvetica Neue', Arial, sans-serif; color: #e0e0e0; }

        /* --- 3D BACKGROUND --- */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* --- UI: SEARCH BAR --- */
        #search-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 50; display: flex; gap: 10px;
            background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #333; border-radius: 30px;
        }
        #search-input {
            background: transparent; border: none; color: #fff; font-size: 1rem;
            padding: 5px 15px; width: 200px; outline: none; font-family: inherit;
        }
        #search-btn {
            background: #fff; color: #000; border: none; border-radius: 50%;
            width: 30px; height: 30px; cursor: pointer; font-weight: bold;
        }
        #search-btn:hover { background: #ccc; }

        /* --- VIDEO PLAYER --- */
        #player-overlay {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 70vw; max-width: 1100px; aspect-ratio: 16/9;
            background: #000; z-index: 10; opacity: 0; pointer-events: none;
            transition: opacity 0.6s ease, transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: 0 30px 60px rgba(0,0,0,1); border: 1px solid #333;
        }
        #player-overlay.active { opacity: 1; transform: translate(-50%, -50%) scale(1); pointer-events: auto; }
        #video-frame { width: 100%; height: 100%; }

        /* --- HUD --- */
        #hud { position: absolute; z-index: 20; width: 100%; height: 100%; pointer-events: none; }

        /* --- LEFT: NAVIGATION --- */
        #nav-panel {
            position: absolute; top: 50%; left: 40px;
            transform: translateY(-50%); display: flex; flex-direction: column; gap: 15px;
            pointer-events: auto; opacity: 0; transition: opacity 0.5s;
        }
        #nav-panel.visible { opacity: 1; }
        .nav-btn {
            background: rgba(0,0,0,0.8); backdrop-filter: blur(10px);
            border: 1px solid #555; color: #ccc; padding: 12px 20px;
            font-family: inherit; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: 0.2s; text-align: left; width: 180px;
        }
        .nav-btn:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.1); }
        .nav-btn.bridge { border-color: #ff0055; color: #ff0055; }
        .nav-btn.bridge:hover { background: #ff0055; color: #fff; }
        .nav-btn.overview { border-color: #fff; color: #fff; font-weight: bold; background: rgba(255,255,255,0.15); }

        /* --- RIGHT: ALGORITHM INFO --- */
        #algo-panel {
            position: absolute; top: 50%; right: 40px;
            transform: translateY(-50%); width: 260px;
            background: rgba(10,10,10,0.9); backdrop-filter: blur(10px);
            border-left: 2px solid #fff; padding: 25px;
            pointer-events: auto; opacity: 0; transition: opacity 0.5s, transform 0.5s;
            transform: translate(20px, -50%);
        }
        #algo-panel.visible { opacity: 1; transform: translate(0, -50%); }
        
        .algo-score { font-family: 'Courier New', monospace; font-size: 0.75rem; color: #00ffcc; margin-bottom: 15px; }
        .btn-asset { width: 100%; background: #fff; color: #000; border: none; padding: 15px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 15px; }

        /* --- EXIT DEBRIEF --- */
        #debrief-modal {
            position: absolute; bottom: 0; left: 0; width: 100%;
            background: rgba(0,0,0,0.95); backdrop-filter: blur(10px); border-top: 1px solid #333;
            padding: 40px; text-align: center; transform: translateY(100%);
            transition: transform 0.5s cubic-bezier(0.19, 1, 0.22, 1); z-index: 30; pointer-events: auto;
        }
        #debrief-modal.active { transform: translateY(0); }
        .btn-debrief { background: transparent; border: 1px solid #444; color: #fff; padding: 10px 30px; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; margin: 0 10px; }
        .btn-debrief.confirm { border-color: #00ffc8; color: #00ffc8; }
        .btn-debrief.confirm:hover { background: #00ffc8; color: #000; }

        /* --- INFO OVERLAY --- */
        #info-overlay { position: absolute; top: 80px; left: 50%; transform: translateX(-50%); text-align: center; width: 100%; pointer-events: none; text-shadow: 0 2px 10px rgba(0,0,0,1); }
        h1.title { margin: 0; font-size: 1.6rem; letter-spacing: -0.5px; font-weight: 300; color: #fff; }
        p.meta { margin: 5px 0 0; font-size: 0.8rem; color: #888; text-transform: uppercase; letter-spacing: 2px; }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <!-- Search UI -->
    <div id="search-container">
        <input type="text" id="search-input" placeholder="Search Topic (e.g. 'Space')..." autocomplete="off">
        <button id="search-btn">&#10140;</button>
    </div>

    <!-- 3D Scene -->
    <div id="canvas-container"></div>

    <!-- Video Player -->
    <div id="player-overlay">
        <div id="video-frame"><div id="player"></div></div>
    </div>

    <!-- UI Layer -->
    <div id="hud">
        <div id="info-overlay">
            <h1 class="title" id="vid-title">System Standby</h1>
            <p class="meta" id="vid-meta">Waiting for Input...</p>
        </div>

        <!-- LEFT: NAVIGATION -->
        <div id="nav-panel">
            <div class="label" style="font-size:0.7rem; color:#666; margin-bottom:5px;">NAVIGATION</div>
            <button class="nav-btn" onclick="navLogic('prev')">&#8592; Previous</button>
            <button class="nav-btn" onclick="navLogic('next')">Next Chapter &#8594;</button>
            <div style="height:10px"></div>
            <button class="nav-btn bridge" id="btn-bridge" onclick="navLogic('bridge')">Take Bridge</button>
            <div style="height:10px"></div>
            <button class="nav-btn overview" onclick="returnToOverview()">Return to Deck</button>
        </div>

        <!-- RIGHT: ALGORITHM DATA -->
        <div id="algo-panel">
            <span class="label">ALGORITHM MATCH</span>
            <div id="algo-data" class="algo-score">WAITING...</div>
            <p style="font-size: 0.85rem; color: #ccc; line-height: 1.4;" id="algo-reason">
                Select a video to see analysis.
            </p>
            <button class="btn-asset" onclick="directBuy()">Direct Action ($)</button>
        </div>
    </div>

    <!-- EXIT DEBRIEF -->
    <div id="debrief-modal">
        <h2 style="margin:0; font-weight:300; letter-spacing: 2px; color:#fff;">SESSION COMPLETE</h2>
        <p style="color:#888; font-size: 0.9rem; margin-top:10px;">Did this content solve your query?</p>
        <div style="margin-top:20px;">
            <button class="btn-debrief" onclick="closeDebrief(false)">Continue</button>
            <button class="btn-debrief confirm" onclick="closeDebrief(true)">Yes, End Session</button>
        </div>
    </div>

    <script>
        // --- 1. THE DATABASE (REAL VIDEOS + METADATA) ---
        // Vibe: 0 (Calm) -> 1 (Intense)
        // Pace: 0 (Slow) -> 1 (Fast)
        const videoDB = [
            { id: 'yQqAG7uHdLM', title: "Inside Google's Data Center", tags: ['tech', 'infrastructure', 'google'], vibe: 0.4, pace: 0.6, topic: "Tech" },
            { id: '0526tl87eQ0', title: "How a Mechanical Watch Works", tags: ['engineering', 'mechanics', 'craft'], vibe: 0.2, pace: 0.3, topic: "Engineering" },
            { id: 'fCn8ts9KXsQ', title: "Primitive Technology: Tiled Roof Hut", tags: ['craft', 'survival', 'building'], vibe: 0.1, pace: 0.2, topic: "Craft" },
            { id: '1ZYbU82GVz4', title: "The Spielberg Oner", tags: ['film', 'analysis', 'camera'], vibe: 0.5, pace: 0.4, topic: "Film" },
            { id: 'cIC2_j5b-0E', title: "What is Life?", tags: ['science', 'philosophy', 'biology'], vibe: 0.6, pace: 0.7, topic: "Science" },
            { id: 'JGwWNGJdvx8', title: "Ed Sheeran - Shape of You", tags: ['music', 'pop', 'audio'], vibe: 0.8, pace: 0.8, topic: "Music" },
            { id: 'LxT1w2Xci-Y', title: "lofi hip hop radio", tags: ['music', 'chill', 'study'], vibe: 0.1, pace: 0.1, topic: "Music" },
            { id: 'gCNeDWCI0vo', title: "First Life with David Attenborough", tags: ['nature', 'biology', 'documentary'], vibe: 0.3, pace: 0.4, topic: "Nature" },
            { id: '0fKBhvDjuy0', title: "Apollo 11 Landing", tags: ['space', 'history', 'nasa'], vibe: 0.9, pace: 0.9, topic: "Space" },
            { id: 'YsR7r3EAxXQ', title: "How to Make a Mechanical Keyboard", tags: ['diy', 'tech', 'craft'], vibe: 0.3, pace: 0.5, topic: "DIY" },
            { id: 'IQ8610M3c_g', title: "The Fyre Festival", tags: ['documentary', 'crime', 'business'], vibe: 0.8, pace: 0.7, topic: "Business" },
            { id: '9bZkp7q19f0', title: "Gangnam Style", tags: ['music', 'viral', 'dance'], vibe: 0.9, pace: 0.9, topic: "Music" },
            { id: 'M7FIvfx5J10', title: "Melodysheep - Our Universe", tags: ['music', 'space', 'art'], vibe: 0.4, pace: 0.5, topic: "Music" }
        ];

        // --- 2. THE ALGORITHM ENGINE ---
        class Algorithm {
            constructor(db) {
                this.db = db;
            }

            // Search by Keyword (Word Matching)
            search(query) {
                const lowerQ = query.toLowerCase();
                return this.db.filter(v => 
                    v.title.toLowerCase().includes(lowerQ) || 
                    v.tags.some(t => t.includes(lowerQ))
                );
            }

            // Find Next: Similar Topic, similar Vibe
            getNext(current) {
                const candidates = this.db.filter(v => v.id !== current.id);
                // Sort by Topic match first, then Vibe distance
                return candidates.sort((a, b) => {
                    const topicMatchA = (a.topic === current.topic) ? 1 : 0;
                    const topicMatchB = (b.topic === current.topic) ? 1 : 0;
                    if (topicMatchA !== topicMatchB) return topicMatchB - topicMatchA;
                    
                    // If topics match, pick closest vibe
                    return Math.abs(a.vibe - current.vibe) - Math.abs(b.vibe - current.vibe);
                })[0];
            }

            // Find Bridge: DIFFERENT Topic, SIMILAR Vibe (Novelty)
            getBridge(current) {
                const candidates = this.db.filter(v => v.id !== current.id && v.topic !== current.topic);
                // Sort by closest Vibe
                return candidates.sort((a, b) => {
                    return Math.abs(a.vibe - current.vibe) - Math.abs(b.vibe - current.vibe);
                })[0];
            }
        }

        const algo = new Algorithm(videoDB);
        let currentCorridor = []; // The list of visible videos
        let currentVideo = null;
        let currentIndex = 0;
        let isOverview = true;
        let player;

        // --- 3. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050505);
        scene.fog = new THREE.FogExp2(0x050505, 0.012);

        const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 15, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const loader = new THREE.TextureLoader();
        loader.setCrossOrigin('anonymous');
        const cardGroup = new THREE.Group();
        scene.add(cardGroup);

        // --- 4. CORRIDOR GENERATION ---
        function buildCorridor(videos) {
            // Clear old meshes
            while(cardGroup.children.length > 0){ 
                const obj = cardGroup.children[0];
                if(obj.geometry) obj.geometry.dispose();
                if(obj.material) {
                    if(obj.material.map) obj.material.map.dispose();
                    obj.material.dispose();
                }
                cardGroup.remove(obj); 
            }

            currentCorridor = videos;
            const geometry = new THREE.PlaneGeometry(14, 10.5);

            videos.forEach((vid, index) => {
                const z = -(index * 40); // Space them out by 40 units

                // Material
                const material = new THREE.MeshBasicMaterial({ color: 0x222222 });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(0, 0, z);
                mesh.userData = { ...vid, index: index };

                // Border
                const borderGeo = new THREE.PlaneGeometry(14.4, 10.9);
                const borderMat = new THREE.MeshBasicMaterial({ color: 0xffffff, wireframe: true, transparent: true, opacity: 0.1 });
                const border = new THREE.Mesh(borderGeo, borderMat);
                border.position.z = -0.2;
                mesh.add(border);

                cardGroup.add(mesh);

                // Load Texture
                const thumbUrl = `https://img.youtube.com/vi/${vid.id}/hqdefault.jpg`;
                loader.load(thumbUrl, (tex) => {
                    mesh.material.map = tex;
                    mesh.material.needsUpdate = true;
                });
            });

            // Floor Line
            const points = [];
            for(let i=0; i<videos.length * 20; i++) points.push(new THREE.Vector3(0, -5, -i * 2));
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const lineMat = new THREE.LineBasicMaterial({ color: 0x333333, transparent: true, opacity: 0.5 });
            const floorLine = new THREE.Line(lineGeo, lineMat);
            cardGroup.add(floorLine);
        }

        // Initialize with a default search
        buildCorridor(algo.search("tech"));

        // --- 5. SEARCH FUNCTIONALITY ---
        document.getElementById('search-btn').addEventListener('click', performSearch);
        document.getElementById('search-input').addEventListener('keypress', (e) => { if(e.key === 'Enter') performSearch(); });

        function performSearch() {
            const query = document.getElementById('search-input').value;
            const results = algo.search(query);
            if(results.length > 0) {
                buildCorridor(results);
                returnToOverview();
                document.getElementById('vid-meta').innerText = `FOUND ${results.length} NODES FOR "${query}"`;
            } else {
                alert("No nodes found in database.");
            }
        }

        // --- 6. INTERACTION LOGIC ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousedown', onMouseDown, false);

        function onMouseDown(event) {
            if(!isOverview) return;
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardGroup.children);
            if (intersects.length > 0) {
                // Find parent mesh (ignore border children)
                let target = intersects[0].object;
                while(target.parent !== cardGroup && target.parent) target = target.parent;
                
                if(target.userData && target.userData.id) {
                    enterFocusMode(target.userData.index);
                }
            }
        }

        function enterFocusMode(index) {
            isOverview = false;
            currentIndex = index;
            currentVideo = currentCorridor[index];
            const targetZ = currentVideo.z;

            new TWEEN.Tween(camera.position)
                .to({ x: 0, y: 0, z: targetZ + 14 }, 1500)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();

            document.getElementById('player-overlay').classList.add('active');
            document.getElementById('nav-panel').classList.add('visible');
            document.getElementById('algo-panel').classList.add('visible');
            document.getElementById('debrief-modal').classList.remove('active');

            loadVideo(currentVideo);
        }

        window.returnToOverview = function() {
            isOverview = true;
            new TWEEN.Tween(camera.position)
                .to({ x: 0, y: 15, z: 25 }, 1500)
                .easing(TWEEN.Easing.Cubic.InOut)
                .start();
            document.getElementById('player-overlay').classList.remove('active');
            document.getElementById('nav-panel').classList.remove('visible');
            document.getElementById('algo-panel').classList.remove('visible');
            if(player) player.pauseVideo();
        };

        window.navLogic = function(type) {
            let nextVid = null;
            let reason = "";

            if (type === 'next') {
                // Check if next is in the generated corridor
                if (currentIndex + 1 < currentCorridor.length) {
                    nextVid = currentCorridor[currentIndex + 1];
                    reason = "Sequential Syllabus";
                } else {
                    // Algorithmically find the next best match from DB
                    nextVid = algo.getNext(currentVideo);
                    reason = "Algorithmic Extension (Similar Topic)";
                }
            } else if (type === 'prev') {
                if (currentIndex > 0) {
                    nextVid = currentCorridor[currentIndex - 1];
                    reason = "Previous Chapter";
                }
            } else if (type === 'bridge') {
                nextVid = algo.getBridge(currentVideo);
                reason = `BRIDGE: Similar Vibe (${currentVideo.topic} -> ${nextVid.topic})`;
            }

            if (nextVid) {
                // Check if it exists in current corridor, if not, we need to handle dynamic insertion (for MVP, we just jump)
                // For this MVP, we will just load the video.
                // Ideally, we would insert it into the 3D scene dynamically.
                currentVideo = nextVid;
                loadVideo(currentVideo);
                
                // Update Algorithm Panel
                updateAlgoPanel(reason, currentVideo);
            }
        };

        function updateAlgoPanel(reason, vid) {
            document.getElementById('algo-data').innerHTML = 
                `TOPIC: ${vid.topic}<br>` +
                `VIBE: ${vid.vibe}<br>` +
                `PACE: ${vid.pace}`;
            document.getElementById('algo-reason').innerText = reason;
        }

        // --- 7. PLAYER ---
        function loadVideo(data) {
            document.getElementById('vid-title').innerText = data.title;
            document.getElementById('vid-meta').innerText = `TOPIC: ${data.topic.toUpperCase()} // SOURCE: YOUTUBE`;
            updateAlgoPanel("Direct Selection", data);

            if (player && player.loadVideoById) {
                player.loadVideoById(data.id);
            }
        }

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                videoId: currentCorridor[0].id,
                playerVars: { 'autoplay': 0, 'controls': 1, 'rel': 0 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED && !isOverview) {
                document.getElementById('debrief-modal').classList.add('active');
            }
        }

        window.closeDebrief = function(success) {
            document.getElementById('debrief-modal').classList.remove('active');
            if (success) {
                returnToOverview();
                alert("SESSION LOGGED.");
            } else {
                navLogic('next');
            }
        };

        window.directBuy = function() {
            alert("DIRECT OPTIMIZATION INITIATED");
        };

        // --- 8. RENDER LOOP ---
        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            if(isOverview) {
                camera.position.x = Math.sin(time * 0.0002) * 2;
                camera.lookAt(0, 0, -60);
            } else {
                camera.lookAt(0, 0, currentVideo ? currentVideo.z : 0);
            }
            renderer.render(scene, camera);
        }
        animate();

        // API Load
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    </script>
</body>
</html>
