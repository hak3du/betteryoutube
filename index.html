<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE CONSTRUCT | IMMERSIVE MODE</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Helvetica Neue', Arial, sans-serif; color: #e0e0e0; }

        /* --- 1. THE BACKGROUND VIDEO PLAYER --- */
        #bg-player-container {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 0; overflow: hidden;
            pointer-events: none; /* Let clicks pass through to 3D */
        }
        /* The actual iframe, scaled huge to cover screen */
        #bg-player {
            position: absolute; top: 50%; left: 50%;
            width: 100vw; height: 56.25vw; /* 16:9 Aspect Ratio */
            min-height: 100vh; min-width: 177.77vh; /* 16:9 Aspect Ratio */
            transform: translate(-50%, -50%);
            opacity: 0.6; /* Slightly dimmed for readability */
            filter: blur(4px) contrast(1.2); /* Cinematic blur effect */
            transition: opacity 1s ease;
        }
        #bg-player.focused {
            opacity: 1; filter: blur(0px) contrast(1); /* Sharp when watching */
        }

        /* Dimming overlay to make text pop */
        #dim-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            z-index: 1; pointer-events: none;
        }

        /* --- 2. 3D SCENE LAYER --- */
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; }

        /* --- 3. UI LAYER --- */
        #hud { position: absolute; z-index: 10; width: 100%; height: 100%; pointer-events: none; }

        /* Search & Top Bar */
        #top-bar {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 15px; pointer-events: auto;
            background: rgba(0,0,0,0.8); padding: 10px 20px; border: 1px solid #444; border-radius: 30px;
            backdrop-filter: blur(10px);
        }
        #search-input {
            background: transparent; border: none; color: #fff; font-size: 1rem;
            width: 200px; outline: none; font-family: inherit;
        }
        #search-btn, #mute-btn {
            background: #fff; color: #000; border: none; border-radius: 50%;
            width: 32px; height: 32px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center;
        }
        #mute-btn { background: #333; color: #fff; border: 1px solid #666; }
        #mute-btn.active { background: #fff; color: #000; }

        /* --- LEFT: NAVIGATION --- */
        #nav-panel {
            position: absolute; top: 50%; left: 40px; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 15px; pointer-events: auto;
        }
        .nav-btn {
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            border: 1px solid #555; color: #ddd; padding: 15px 25px;
            font-family: inherit; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; transition: 0.3s; text-align: left; width: 220px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .nav-btn:hover { border-color: #fff; color: #fff; background: rgba(255,255,255,0.1); transform: translateX(5px); }
        .nav-btn.bridge { border-color: #ff0055; color: #ff0055; }
        .nav-btn.bridge:hover { background: #ff0055; color: #fff; }
        
        /* --- RIGHT: LOGIC PANEL --- */
        #algo-panel {
            position: absolute; top: 50%; right: 40px; transform: translateY(-50%);
            width: 280px; background: rgba(10,10,10,0.85); backdrop-filter: blur(15px);
            border-left: 2px solid #00ffcc; padding: 25px;
            pointer-events: auto; box-shadow: 0 0 30px rgba(0,255,204,0.1);
        }
        .label { font-size: 0.7rem; color: #00ffcc; text-transform: uppercase; margin-bottom: 10px; display: block; letter-spacing: 2px; }
        .algo-text { font-family: 'Courier New', monospace; font-size: 0.8rem; color: #ccc; line-height: 1.5; margin-bottom: 20px; }
        .btn-asset { width: 100%; background: #fff; color: #000; border: none; padding: 12px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 10px; }

        /* --- CENTER INFO --- */
        #center-info {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            text-align: center; pointer-events: none; text-shadow: 0 2px 10px #000;
        }
        h1.title { margin: 0; font-size: 2rem; letter-spacing: -1px; font-weight: 300; color: #fff; }
        p.meta { margin: 5px 0 0; font-size: 0.9rem; color: #aaa; text-transform: uppercase; letter-spacing: 3px; }

    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    <!-- 1. BACKGROUND VIDEO (The "Environment") -->
    <div id="bg-player-container">
        <div id="player"></div> <!-- YouTube mounts here -->
    </div>
    <div id="dim-overlay"></div>

    <!-- 2. 3D CORRIDOR -->
    <div id="canvas-container"></div>

    <!-- 3. UI LAYER -->
    <div id="hud">
        
        <!-- Top Bar -->
        <div id="top-bar">
            <input type="text" id="search-input" placeholder="Search Syllabus..." autocomplete="off">
            <button id="search-btn">&#10140;</button>
            <div style="width:1px; background:#444; height:20px; align-self:center;"></div>
            <button id="mute-btn" onclick="toggleMute()">SOUND</button>
        </div>

        <!-- Left Nav -->
        <div id="nav-panel">
            <div class="label" style="color:#666">SYLLABUS NAV</div>
            <button class="nav-btn" onclick="navLogic('prev')">&#8592; PREVIOUS CHAPTER</button>
            <button class="nav-btn" onclick="navLogic('next')">NEXT CHAPTER &#8594;</button>
            <div style="height:15px"></div>
            <!-- Dynamic Bridge Button -->
            <button class="nav-btn bridge" id="btn-bridge" onclick="navLogic('bridge')">TAKE BRIDGE</button>
        </div>

        <!-- Right Logic Panel -->
        <div id="algo-panel">
            <span class="label">Current Analysis</span>
            <div id="algo-content" class="algo-text">
                Waiting for selection...
            </div>
            <span class="label">Direct Optimization</span>
            <button class="btn-asset" onclick="directBuy()">Acquire Asset</button>
        </div>

        <!-- Center Info -->
        <div id="center-info">
            <h1 class="title" id="vid-title">THE CONSTRUCT</h1>
            <p class="meta" id="vid-meta">Select a Node to Initialize Stream</p>
        </div>
    </div>

    <script>
        // --- 1. DATABASE: DESIGN & ENGINEERING SYLLABUS (Highly Related) ---
        const db = [
            { id: '0526tl87eQ0', title: "How a Mechanical Watch Works", tags: ['engineering', 'mechanics'], vibe: 0.2, topic: "Engineering" },
            { id: 'yQqAG7uHdLM', title: "Inside Google's Data Center", tags: ['tech', 'infrastructure'], vibe: 0.5, topic: "Tech" },
            { id: 'fCn8ts9KXsQ', title: "Primitive Tech: Tiled Roof Hut", tags: ['craft', 'building'], vibe: 0.1, topic: "Craft" },
            { id: 'YsR7r3EAxXQ', title: "How to Make a Mechanical Keyboard", tags: ['diy', 'tech'], vibe: 0.3, topic: "DIY" },
            { id: '9bZkp7q19f0', title: "The Art of Typography", tags: ['design', 'art'], vibe: 0.4, topic: "Design" },
            { id: 'gCNeDWCI0vo', title: "First Life with David Attenborough", tags: ['nature', 'biology'], vibe: 0.3, topic: "Nature" },
            { id: '0fKBhvDjuy0', title: "Apollo 11 Landing", tags: ['space', 'history'], vibe: 0.9, topic: "Space" },
            { id: '1ZYbU82GVz4', title: "The Spielberg Oner", tags: ['film', 'camera'], vibe: 0.6, topic: "Film" }
        ];

        // --- 2. ALGORITHM ENGINE ---
        class Algorithm {
            constructor(data) { this.data = data; }
            
            search(q) {
                const low = q.toLowerCase();
                return this.data.filter(v => v.title.toLowerCase().includes(low) || v.tags.some(t=>t.includes(low)));
            }

            getNext(current) {
                // Find next in list or closest topic match
                const idx = this.data.indexOf(current);
                if(idx < this.data.length -1) return this.data[idx+1];
                // Loop or find similar
                return this.data.find(v => v.topic === current.topic && v.id !== current.id) || this.data[0];
            }

            getBridge(current) {
                // Find DIFFERENT topic, SIMILAR vibe
                const candidates = this.data.filter(v => v.topic !== current.topic);
                return candidates.sort((a,b) => Math.abs(a.vibe - current.vibe) - Math.abs(b.vibe - current.vibe))[0];
            }
        }

        const algo = new Algorithm(db);
        let currentVideo = db[0]; // Start with Watch
        let isMuted = true;

        // --- 3. THREE.JS SCENE ---
        const scene = new THREE.Scene();
        // Transparent background so we see the video behind it
        scene.background = null; 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
        camera.position.set(0, 10, 30); // Back view

        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true }); // Alpha true for transparency
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting for the 3D objects to pop against the video
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Build Corridor
        const loader = new THREE.TextureLoader();
        const cardGroup = new THREE.Group();
        scene.add(cardGroup);

        function buildCorridor(vids) {
            // Clear
            while(cardGroup.children.length > 0){ cardGroup.remove(cardGroup.children[0]); }
            
            const geometry = new THREE.PlaneGeometry(12, 6.75); // 16:9
            const borderGeo = new THREE.PlaneGeometry(12.5, 7.25);

            vids.forEach((vid, i) => {
                const z = -i * 15;
                
                // Card Material (Use transparent png or just color + texture)
                const material = new THREE.MeshPhongMaterial({ 
                    color: 0xffffff, 
                    transparent: true, 
                    opacity: 0.9,
                    side: THREE.DoubleSide
                });
                
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(0, 0, z);
                mesh.userData = vid;

                // Border (Neon glow)
                const borderMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true, transparent: true, opacity: 0.5 });
                const border = new THREE.Mesh(borderGeo, borderMat);
                border.position.z = -0.1;
                mesh.add(border);

                // Load Texture
                loader.load(`https://img.youtube.com/vi/${vid.id}/hqdefault.jpg`, (tex) => {
                    mesh.material.map = tex;
                    mesh.material.needsUpdate = true;
                });

                cardGroup.add(mesh);
            });
        }
        buildCorridor(db); // Init with DB

        // --- 4. BACKGROUND PLAYER LOGIC ---
        let player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%', width: '100%',
                videoId: currentVideo.id,
                playerVars: { 
                    'autoplay': 1, 
                    'controls': 0, // Hide controls for cinematic background
                    'loop': 1, 
                    'playlist': currentVideo.id, // Loop single video
                    'mute': 1 
                },
                events: { 'onReady': onPlayerReady }
            });
        }

        function onPlayerReady(event) {
            updateBackground(currentVideo);
        }

        function updateBackground(vid) {
            currentVideo = vid;
            
            // Update UI
            document.getElementById('vid-title').innerText = vid.title;
            document.getElementById('vid-meta').innerText = `TOPIC: ${vid.topic.toUpperCase()} // VIBE: ${vid.vibe}`;
            
            // Update Algorithm Panel
            const bridge = algo.getBridge(vid);
            const vibeDiff = Math.abs(bridge.vibe - vid.vibe).toFixed(2);
            const matchScore = (1 - vibeDiff) * 100;
            
            document.getElementById('algo-content').innerHTML = `
                TOPIC: <span style="color:#fff">${vid.topic}</span><br>
                VIBE SCORE: ${vid.vibe}<br><br>
                <span style="color:#ff0055">BRIDGE DETECTED:</span><br>
                Topic: ${bridge.topic}<br>
                Vibe Match: ${matchScore.toFixed(0)}%
            `;

            // Update Bridge Button Text
            document.getElementById('btn-bridge').innerText = `BRIDGE TO ${bridge.topic.toUpperCase()}`;

            // Change Background Video
            if(player && player.loadVideoById) {
                player.loadVideoById({
                    videoId: vid.id,
                    startSeconds: 0,
                    suggestedQuality: 'hd1080'
                });
                if(isMuted) player.mute();
                else player.unMute();
            }
        }

        // --- 5. INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('mousemove', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            
            // Hover Effect logic (optional preview)
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardGroup.children);
            if(intersects.length > 0) {
                document.body.style.cursor = 'pointer';
                // Could highlight here
            } else {
                document.body.style.cursor = 'default';
            }
        });

        window.addEventListener('mousedown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(cardGroup.children);
            if(intersects.length > 0) {
                updateBackground(intersects[0].object.userData);
                // Slight camera zoom effect could go here
            }
        });

        // --- 6. NAVIGATION FUNCTIONS ---
        window.navLogic = function(type) {
            let next = null;
            if(type === 'next') next = algo.getNext(currentVideo);
            if(type === 'prev') {
                const idx = db.indexOf(currentVideo);
                if(idx > 0) next = db[idx-1];
            }
            if(type === 'bridge') next = algo.getBridge(currentVideo);

            if(next) {
                // Animate Camera to next card?
                const targetZ = db.indexOf(next) * -15;
                new TWEEN.Tween(camera.position)
                    .to({ z: 30 + targetZ }, 1000)
                    .easing(TWEEN.Easing.Cubic.Out)
                    .start();
                
                updateBackground(next);
            }
        };

        window.toggleMute = function() {
            isMuted = !isMuted;
            const btn = document.getElementById('mute-btn');
            if(isMuted) {
                player.mute();
                btn.classList.remove('active');
            } else {
                player.unMute();
                btn.classList.add('active');
            }
        };

        // Search
        document.getElementById('search-btn').addEventListener('click', () => {
            const q = document.getElementById('search-input').value;
            const res = algo.search(q);
            if(res.length) {
                db.length = 0; db.push(...res); // Update main list
                buildCorridor(db);
                updateBackground(db[0]);
                camera.position.z = 30; // Reset cam
            }
        });

        window.directBuy = function() { alert("Direct Optimization: Asset acquired."); };

        // --- 7. LOOP ---
        function animate(time) {
            requestAnimationFrame(animate);
            TWEEN.update(time);
            
            // Gentle floating of cards
            cardGroup.children.forEach((card, i) => {
                card.position.y = Math.sin(time * 0.001 + i) * 0.5;
            });

            camera.lookAt(0, 0, camera.position.z - 50); // Always look forward
            renderer.render(scene, camera);
        }
        animate();

        // API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
